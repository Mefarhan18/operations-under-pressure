version: '3.8'

services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: newtonite_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-newtonite_ops}
      MYSQL_USER: ${DB_USERNAME:-newtonite_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-newtonite_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3 Backend Service (Optional multi-container run)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite_backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-newtonite_ops}
      - DB_USERNAME=${DB_USERNAME:-newtonite_user}
      - DB_PASSWORD=${DB_PASSWORD:-newtonite_pass}
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy

  # React + Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newtonite_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
